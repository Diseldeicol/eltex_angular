<article class="article-card article-item">
   <a class="article-card-link" [routerLink]="['/blog', article.id]">
        <div class="article-img-wrapper">
        <img [src]="article.imageUrl" alt="Фотография">
        </div>

        <div class="article-content">
        <h4>{{ article.title }}</h4>
        <p>{{ article.text }}</p>
        <p>Рейтинг: {{ article.rating }}</p>
        <time [attr.datetime]="article.date">
            {{ article.date | date:'dd.MM.yyyy' }}
        </time>
        </div>
    </a>
    <button class="button-delete" title="Удалить статью" data-delete (click)="onDelete()">  
        <mat-icon>delete</mat-icon>
    </button>
    <button class="button-edit" title="Редактировать статью" (click)="onEdit()">  
        <mat-icon>edit</mat-icon>
    </button>
</article>
